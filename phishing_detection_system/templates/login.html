<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            🛡️ Phishing Detector
        </div>
        <ul class="navbar-nav">
            <li><a href="/">Home</a></li>
            <li><a href="/detect">Detect</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 400px; margin: 4rem auto;">
            <h2 class="card-header" style="text-align: center;">🔐 Admin Login</h2>
            
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input 
                        type="text" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter password"
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    🚀 Login
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; color: var(--gray-500);">
                <p>Default credentials</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>🔒 Phishing Detection System &copy; 2024</p>
    </div>
</body>
</html>
